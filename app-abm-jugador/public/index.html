<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ABM Jugador - Mundial</title>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#0b5fff; --danger:#dc2626; --border:#dbe3ee; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin:0; background:var(--bg); color:var(--text); }
    header { padding:24px; background:#0f172a; color:#fff; }
    header h1 { margin:0 0 4px; font-size:1.6rem; }
    header p { margin:0; color:#cbd5e1; }
    main { max-width:1200px; margin:24px auto; padding:0 16px 32px; display:grid; gap:16px; grid-template-columns:360px 1fr; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
    h2 { margin:0 0 12px; font-size:1.1rem; }
    label { display:block; font-size:.9rem; margin:10px 0 4px; color:#374151; }
    input, select, button, textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:.95rem; }
    input:focus, select:focus, textarea:focus { outline:2px solid #bfd3ff; border-color:#93b4ff; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    .actions { display:flex; gap:8px; margin-top:14px; }
    button { cursor:pointer; border:0; font-weight:600; }
    .primary { background:var(--primary); color:#fff; }
    .secondary { background:#e5e7eb; color:#111827; }
    .danger { background:var(--danger); color:#fff; }
    .small { width:auto; padding:7px 10px; font-size:.85rem; }
    .toolbar { display:flex; gap:8px; margin-bottom:12px; }
    .toolbar input { flex:1; }
    table { width:100%; border-collapse:collapse; font-size:.92rem; }
    th, td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
    th { color:#374151; background:#f8fafc; position:sticky; top:0; }
    .table-wrap { overflow:auto; max-height:70vh; }
    .muted { color:var(--muted); font-size:.85rem; }
    .status { margin-top:10px; padding:10px; border-radius:8px; font-size:.9rem; display:none; }
    .status.ok { display:block; background:#ecfdf5; color:#065f46; }
    .status.err { display:block; background:#fef2f2; color:#991b1b; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; font-size:.78rem; }
    .hidden { display:none; }
    @media (max-width: 980px) { main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>ABM Jugador</h1>
    <p>Entrega 9 · Grupo 8 · tabla <code>Mundial.Jugador</code></p>
  </header>
  <main>
    <section class="card">
      <h2 id="formTitle">Alta de jugador</h2>
      <form id="jugadorForm">
        <input type="hidden" id="id_jugador" />

        <label for="id_lista_convocados">Lista de convocados / selección</label>
        <select id="id_lista_convocados" required></select>

        <div class="row">
          <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" maxlength="50" required />
          </div>
          <div>
            <label for="apellido">Apellido</label>
            <input id="apellido" maxlength="50" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="dorsal">Dorsal</label>
            <input id="dorsal" type="number" min="1" max="99" required />
          </div>
          <div>
            <label for="club">Club</label>
            <input id="club" maxlength="50" required />
          </div>
        </div>

        <div id="bajaBox" class="hidden">
          <label for="motivo_baja">Motivo de baja</label>
          <select id="motivo_baja">
            <option value="">Seleccionar motivo...</option>
            <option value="Lesión">Lesión</option>
            <option value="Decisión técnica">Decisión técnica</option>
            <option value="Sanción disciplinaria">Sanción disciplinaria</option>
            <option value="Motivo personal">Motivo personal</option>
            <option value="Transferencia administrativa">Transferencia administrativa</option>
            <option value="Otro">Otro</option>
          </select>
          <label for="detalle_baja">Detalle (opcional)</label>
          <textarea id="detalle_baja" rows="2" maxlength="200" placeholder="Detalle adicional"></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="primary" id="submitBtn">Crear jugador</button>
          <button type="button" class="secondary" id="cancelBtn">Limpiar</button>
          <button type="button" class="danger hidden" id="deleteBtn">Dar de baja</button>
        </div>
      </form>
      <div id="status" class="status"></div>
      <p class="muted" style="margin-top:12px">Alta/Modificación usan los SPs <code>MfSPabm.altaJugador</code> y <code>MfSPabm.modificacionJugador</code>. La baja usa <code>MfSPabm.bajaJugador</code> y requiere seleccionar motivo en la UI.</p>
    </section>

    <section class="card">
      <h2>Jugadores</h2>
      <div class="toolbar">
        <input id="search" placeholder="Buscar por nombre, apellido, club o selección..." />
        <button class="secondary small" id="refreshBtn" style="width:auto">Actualizar</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Selección</th>
              <th>Dorsal</th>
              <th>Jugador</th>
              <th>Club</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { jugadores: [], listas: [], selected: null };

    function setStatus(msg, type = 'ok') {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status ' + (type === 'err' ? 'err' : 'ok');
    }
    function clearStatus() { const el = $('status'); el.textContent = ''; el.className = 'status'; }

    async function api(url, opts = {}) {
      const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Error de servidor');
      return data;
    }

    function resetForm() {
      $('jugadorForm').reset();
      $('id_jugador').value = '';
      $('formTitle').textContent = 'Alta de jugador';
      $('submitBtn').textContent = 'Crear jugador';
      $('deleteBtn').classList.add('hidden');
      $('bajaBox').classList.add('hidden');
      state.selected = null;
      clearStatus();
    }

    function fillForm(j) {
      state.selected = j;
      $('id_jugador').value = j.id_jugador;
      $('id_lista_convocados').value = j.id_lista_convocados;
      $('nombre').value = j.nombre;
      $('apellido').value = j.apellido;
      $('dorsal').value = j.dorsal;
      $('club').value = j.club || '';
      $('formTitle').textContent = `Modificar jugador #${j.id_jugador}`;
      $('submitBtn').textContent = 'Guardar cambios';
      $('deleteBtn').classList.remove('hidden');
      $('bajaBox').classList.remove('hidden');
      clearStatus();
    }

    function renderListas() {
      const sel = $('id_lista_convocados');
      sel.innerHTML = '<option value="">Seleccionar...</option>' +
        state.listas.map(l => `<option value="${l.id_lista}">${l.seleccion} (lista ${l.id_lista})</option>`).join('');
    }

    function renderJugadores() {
      const q = $('search').value.toLowerCase().trim();
      const rows = state.jugadores.filter(j => !q || [j.nombre, j.apellido, j.club, j.seleccion, String(j.dorsal)].some(v => (v||'').toLowerCase().includes(q)));
      $('tbody').innerHTML = rows.map(j => `
        <tr>
          <td>${j.id_jugador}</td>
          <td><span class="pill">${j.seleccion || ''}</span></td>
          <td>${j.dorsal ?? ''}</td>
          <td><strong>${j.apellido}, ${j.nombre}</strong></td>
          <td>${j.club || ''}</td>
          <td><button class="secondary small" data-edit="${j.id_jugador}">Editar</button></td>
        </tr>`).join('') || '<tr><td colspan="6" class="muted">Sin jugadores.</td></tr>';
    }

    async function loadAll() {
      const [listas, jugadores] = await Promise.all([api('/api/listas'), api('/api/jugadores')]);
      state.listas = listas;
      state.jugadores = jugadores;
      renderListas();
      if (state.selected) $('id_lista_convocados').value = state.selected.id_lista_convocados;
      renderJugadores();
    }

    $('jugadorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();
      const payload = {
        id_lista_convocados: Number($('id_lista_convocados').value),
        nombre: $('nombre').value.trim(),
        apellido: $('apellido').value.trim(),
        dorsal: Number($('dorsal').value),
        club: $('club').value.trim(),
      };
      const id = $('id_jugador').value;
      try {
        if (id) {
          await api(`/api/jugadores/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
          setStatus('Jugador modificado exitosamente.');
        } else {
          await api('/api/jugadores', { method: 'POST', body: JSON.stringify(payload) });
          setStatus('Jugador creado exitosamente.');
          $('jugadorForm').reset();
        }
        await loadAll();
        if (id) {
          const fresh = state.jugadores.find(j => j.id_jugador === Number(id));
          if (fresh) fillForm(fresh);
        }
      } catch (err) { setStatus(err.message, 'err'); }
    });

    $('deleteBtn').addEventListener('click', async () => {
      const id = $('id_jugador').value;
      if (!id) return;
      const motivo = $('motivo_baja').value;
      if (!motivo) { setStatus('Seleccioná un motivo de baja antes de eliminar.', 'err'); return; }
      const detalle = $('detalle_baja').value.trim();
      const nombre = `${$('apellido').value}, ${$('nombre').value}`;
      if (!confirm(`¿Dar de baja a ${nombre}?\nMotivo: ${motivo}${detalle ? '\nDetalle: ' + detalle : ''}`)) return;
      try {
        await api(`/api/jugadores/${id}`, { method: 'DELETE', body: JSON.stringify({ motivo, detalle }) });
        setStatus(`Jugador dado de baja. Motivo: ${motivo}.`);
        resetForm();
        await loadAll();
      } catch (err) { setStatus(err.message, 'err'); }
    });

    $('cancelBtn').addEventListener('click', resetForm);
    $('refreshBtn').addEventListener('click', () => loadAll().catch(err => setStatus(err.message, 'err')));
    $('search').addEventListener('input', renderJugadores);
    $('tbody').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-edit]');
      if (!btn) return;
      const j = state.jugadores.find(x => x.id_jugador === Number(btn.dataset.edit));
      if (j) fillForm(j);
    });

    loadAll().catch(err => setStatus('No se pudo cargar la app: ' + err.message, 'err'));
  </script>
</body>
</html>
